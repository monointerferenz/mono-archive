[package]
name = "mono-archive"
version = "0.1.0"
description = "Project archive manager for monointerferenz"
authors = ["monointerferenz"]
edition = "2021"

[lib]
name = "mono_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
